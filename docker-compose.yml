services:
  comfyui2api:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ./runs:/app/runs
    environment:
      API_LISTEN: "0.0.0.0"
      API_PORT: "8460"
      WORKFLOWS_DIR: "/app/comfyui-api-workflows"
      RUNS_DIR: "/app/runs"
      DATA_DIR: "/app/data"
      INPUT_SUBDIR: "${INPUT_SUBDIR:-comfyui2api}"
      API_TOKEN: "${API_TOKEN:?API_TOKEN is required}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      HEALTH_CHECK_INTERVAL_S: "${HEALTH_CHECK_INTERVAL_S:-60}"
      HEALTH_CHECK_TIMEOUT_S: "${HEALTH_CHECK_TIMEOUT_S:-5}"
      UV_PROJECT_ENVIRONMENT: "/opt/comfyui2api-venv"
    command: >
      sh -lc "uv sync --locked &&
              uv run --locked --no-sync -m comfyui2api"
    ports:
      - "8460:8460"
